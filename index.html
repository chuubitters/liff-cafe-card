<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Card - SoulVibes Cafe</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #6F4E37; 
            --bg-color: #F8F9FA;
            --card-bg: #FFFFFF;
            --text-color: #333333;
        }

        body {
            font-family: 'Prompt', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 400px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        .logo { width: 80px; height: auto; margin-bottom: 15px; }

        .profile-section {
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 25px; border-bottom: 1px solid #EEEEEE; padding-bottom: 15px;
        }

        #pictureUrl {
            width: 60px; height: 60px; border-radius: 50%;
            margin-right: 15px; border: 2px solid var(--primary-color);
        }

        #displayName { font-size: 1.2rem; font-weight: 500; }

        .stamp-card {
            background-color: var(--card-bg); padding: 15px;
            border-radius: 10px; border: 2px dashed var(--primary-color);
        }

        .stamp-card h3 { margin-top: 0; color: var(--primary-color); }

        .stamps-grid {
            display: grid; grid-template-columns: repeat(5, 1fr);
            gap: 10px; margin-top: 15px;
        }

        .stamp-dot {
            width: 40px; height: 40px; border-radius: 50%;
            border: 2px solid #DDDDDD; display: flex; justify-content: center;
            align-items: center; font-size: 0.9rem; color: #AAAAAA;
            transition: all 0.3s ease; /* เพิ่มแอนิเมชันตอนแต้มเด้ง */
        }

        .stamp-dot.active {
            background-color: var(--primary-color); border-color: var(--primary-color); color: #FFFFFF;
        }

        .status-text { margin-top: 15px; font-size: 0.9rem; color: #666666; }

        /* ปุ่มสแกนคิวอาร์ */
        .scan-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 1rem;
            font-family: 'Prompt', sans-serif;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .scan-btn:active { transform: scale(0.98); }

    </style>
</head>
<body>

    <div class="container">
        <img src="logo.png" alt="Logo" class="logo">

        <div class="profile-section">
            <img src="" alt="Profile" id="pictureUrl"> 
            <div id="displayName">กำลังโหลด...</div> 
        </div>

        <div class="stamp-card">
            <h3>สะสมแต้ม</h3>
            <div class="stamps-grid">
                <div class="stamp-dot active">1</div>
                <div class="stamp-dot active">2</div>
                <div class="stamp-dot active">3</div>
                <div class="stamp-dot active">4</div>
                <div class="stamp-dot active">5</div>
                
                <div class="stamp-dot">6</div>
                <div class="stamp-dot">7</div>
                <div class="stamp-dot">8</div>
                <div class="stamp-dot">9</div>
                <div class="stamp-dot">10</div>
            </div>
            <p class="status-text">สะสมอีก 5 แต้ม เพื่อรับกาแฟฟรี 1 แก้ว!</p>
        </div>

        <button id="scanBtn" class="scan-btn">สแกนคิวอาร์รับแต้ม</button>
    </div>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    
    <script>
        // 🚨 เอา LIFF ID ที่ได้มาใส่ตรงนี้ (อย่าลืมลบคำว่า YOUR_LIFF_ID ออก)
        const myLiffId = '2009509356-zUgpStRs'; 

        async function main() {
            await liff.init({ liffId: myLiffId });

            if (liff.isLoggedIn()) {
                const profile = await liff.getProfile();
                document.getElementById('displayName').innerText = profile.displayName;
                document.getElementById('pictureUrl').src = profile.pictureUrl;
            } else {
                liff.login();
            }
        }

        main();

// 🟢 ระบบจำลองสแกนแล้วบวกแต้ม (แบบชัวร์ 100% สำหรับพรีเซนต์)
        document.getElementById('scanBtn').addEventListener('click', async () => {
            if (!liff.isInClient()) {
                alert('ต้องเปิดผ่านแอป LINE บนมือถือเท่านั้นถึงจะสแกนได้ครับ!');
                return;
            }

            try {
                // 1. เปิดกล้องขึ้นมาให้แกล้งๆ สแกน
                await liff.scanCodeV2();
            } catch (error) {
                // ถ้ากดยกเลิก หรือ error ก็ปล่อยผ่านไปเลย
                console.log('ปิดกล้อง');
            }

            // 2. 🟢 พอกล้องปิดปุ๊บ ไม่ง้อผลสแกน แจกแต้มทันที! (เซฟสุดๆ)
            const inactiveStamps = document.querySelectorAll('.stamp-dot:not(.active)');
            
            if (inactiveStamps.length > 0) {
                inactiveStamps[0].classList.add('active'); // ระบายสีแต้มวงถัดไปให้เต็ม
                
                const remaining = inactiveStamps.length - 1;
                document.querySelector('.status-text').innerText = `สะสมอีก ${remaining} แต้ม เพื่อรับกาแฟฟรี 1 แก้ว!`;
                
                // ดีเลย์นิดนึงให้ดูเนียนๆ แล้วค่อยเด้งแจ้งเตือน
                setTimeout(() => {
                    alert(' ยินดีด้วย! คุณได้รับ 1 แต้ม');
                }, 400);
            } else {
                alert('แต้มของคุณเต็มแล้ว! แลกรับเครื่องดื่มได้เลย ☕');
            }
        });
    </script>
</body>
</html>
